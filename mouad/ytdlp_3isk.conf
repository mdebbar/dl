# File name format
-o "%(series)s/%(series)s %(season)sx%(episode)s.%(ext)s"

# Parallelization
-N 8

# Filter out episodes that are still pending duration stability
--match-filter "!is_pending"

# VPN
# --proxy "socks5://10.10.10.10:40000"

# Never invoke ffmpeg to fix videos
# --fixup never

# Download location
-P /app/downloads

# Archive of existing downloads
# Download archive isn't useful since these downloads don't have the right (ie_key, id) pair.
# --download-archive /app/downloads/downloaded.txt

--no-config
